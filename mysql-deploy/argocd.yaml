apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mysql-db-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-username/Openshift-platform-Kustomized.git'
    targetRevision: HEAD
    path: mysql-deploy/
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: db-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true